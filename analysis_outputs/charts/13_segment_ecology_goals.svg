<text x="70" y="48" class="title">S1-S5 Ecology Goals</text><text x="70" y="72" class="subtitle">Segment-specific ecology tasks linked to planting and hydro-biological interpretation.</text><rect x="70" y="125" width="80" height="40" fill="#4f6f64"/><text x="80" y="151" class="header">seg</text><rect x="150" y="125" width="270" height="40" fill="#4f6f64"/><text x="160" y="151" class="header">ecological goal</text><rect x="420" y="125" width="285" height="40" fill="#4f6f64"/><text x="430" y="151" class="header">planting structure</text><rect x="705" y="125" width="360" height="40" fill="#4f6f64"/><text x="715" y="151" class="header">hydrobio role</text><rect x="1065" y="125" width="90" height="40" fill="#4f6f64"/><text x="1075" y="151" class="header">priority</text><rect x="70" y="165" width="80" height="75" fill="#eef2ed" stroke="#d7ded7"/><text x="80" y="190" class="cell">S1</text><rect x="150" y="165" width="270" height="75" fill="#eef2ed" stroke="#d7ded7"/><text x="160" y="190" class="cell">entry shade and</text><text x="160" y="204" class="cell">low-disturbance</text><text x="160" y="218" class="cell">orientation</text><rect x="420" y="165" width="285" height="75" fill="#eef2ed" stroke="#d7ded7"/><text x="430" y="190" class="cell">drought-tolerant canopy +</text><text x="430" y="204" class="cell">low shrubs</text><rect x="705" y="165" width="360" height="75" fill="#eef2ed" stroke="#d7ded7"/><text x="715" y="190" class="cell">gateway interpretation</text><rect x="1075" y="181" width="48" height="40" rx="5" fill="#e4c979"/><text x="1099" y="207" text-anchor="middle" class="score">3</text><rect x="70" y="240" width="80" height="75" fill="#f7f4ed" stroke="#d7ded7"/><text x="80" y="265" class="cell">S2</text><rect x="150" y="240" width="270" height="75" fill="#f7f4ed" stroke="#d7ded7"/><text x="160" y="265" class="cell">heritage-first</text><text x="160" y="279" class="cell">ecological</text><text x="160" y="293" class="cell">interpretation</text><rect x="420" y="240" width="285" height="75" fill="#f7f4ed" stroke="#d7ded7"/><text x="430" y="265" class="cell">shallow herbs /</text><text x="430" y="279" class="cell">reversible containers</text><rect x="705" y="240" width="360" height="75" fill="#f7f4ed" stroke="#d7ded7"/><text x="715" y="265" class="cell">no deep-root or heavy wetland</text><text x="715" y="279" class="cell">insertion</text><rect x="1075" y="256" width="48" height="40" rx="5" fill="#9f4d4a"/><text x="1099" y="282" text-anchor="middle" class="score">5</text><rect x="70" y="315" width="80" height="75" fill="#eef2ed" stroke="#d7ded7"/><text x="80" y="340" class="cell">S3</text><rect x="150" y="315" width="270" height="75" fill="#eef2ed" stroke="#d7ded7"/><text x="160" y="340" class="cell">rain garden and heat</text><text x="160" y="354" class="cell">mitigation</text><rect x="420" y="315" width="285" height="75" fill="#eef2ed" stroke="#d7ded7"/><text x="430" y="340" class="cell">canopy + Carex / Juncus</text><text x="430" y="354" class="cell">wet-dry edge</text><rect x="705" y="315" width="360" height="75" fill="#eef2ed" stroke="#d7ded7"/><text x="715" y="340" class="cell">stormwater filtration before</text><text x="715" y="354" class="cell">river edge</text><rect x="1075" y="331" width="48" height="40" rx="5" fill="#9f4d4a"/><text x="1099" y="357" text-anchor="middle" class="score">5</text><rect x="70" y="390" width="80" height="75" fill="#f7f4ed" stroke="#d7ded7"/><text x="80" y="415" class="cell">S4</text><rect x="150" y="390" width="270" height="75" fill="#f7f4ed" stroke="#d7ded7"/><text x="160" y="415" class="cell">warehouse heritage with</text><text x="160" y="429" class="cell">insect-friendly planting</text><rect x="420" y="390" width="285" height="75" fill="#f7f4ed" stroke="#d7ded7"/><text x="430" y="415" class="cell">low shrubs + flowering</text><text x="430" y="429" class="cell">drought herbs</text><rect x="705" y="390" width="360" height="75" fill="#f7f4ed" stroke="#d7ded7"/><text x="715" y="415" class="cell">micro stepping-stone habitat</text><rect x="1075" y="406" width="48" height="40" rx="5" fill="#e4c979"/><text x="1099" y="432" text-anchor="middle" class="score">3</text><rect x="70" y="465" width="80" height="75" fill="#eef2ed" stroke="#d7ded7"/><text x="80" y="490" class="cell">S5</text><rect x="150" y="465" width="270" height="75" fill="#eef2ed" stroke="#d7ded7"/><text x="160" y="490" class="cell">bridge cooling and flood</text><text x="160" y="504" class="cell">recovery</text><rect x="420" y="465" width="285" height="75" fill="#eef2ed" stroke="#d7ded7"/><text x="430" y="490" class="cell">upper shade trees + lower</text><text x="430" y="504" class="cell">robust herbs</text><rect x="705" y="465" width="360" height="75" fill="#eef2ed" stroke="#d7ded7"/><text x="715" y="490" class="cell">floodable edge and bird resting</text><text x="715" y="504" class="cell">potential</text><rect x="1075" y="481" width="48" height="40" rx="5" fill="#9f4d4a"/><text x="1099" y="507" text-anchor="middle" class="score">5</text>
