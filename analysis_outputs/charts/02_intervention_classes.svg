<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="500" viewBox="0 0 1180 500">
<rect width="100%" height="100%" fill="#fbfaf7"/>
<style>
text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #263238; }
.title { font-size: 24px; font-weight: 700; }
.subtitle { font-size: 13px; fill: #607d72; }
.axis { stroke: #607d72; stroke-width: 1; }
.grid { stroke: #d8ded8; stroke-width: 1; stroke-dasharray: 3 4; }
.label { font-size: 12px; }
.small { font-size: 10px; fill: #607d72; }
.note { font-size: 11px; fill: #789087; }
</style>

<text x="48" y="48" class="title">防洪墙与河岸可介入性分级</text>
<text x="48" y="72" class="subtitle">综合遗产敏感、防洪安全、可达需求和维护复杂度；分级用于限制设计动作强度。</text>
