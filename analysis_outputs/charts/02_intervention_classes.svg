fill="#fff" font-size="11" font-family=""Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Arial, sans-serif">3.55</text><text x="764.0" y="272" text-anchor="middle" class="small">S4</text><text x="764.0" y="290" text-anchor="middle" class="small">300-400m</text><rect x="864.0" y="160" width="192.0" height="85" fill="#d99a55" rx="4"/><text x="960.0" y="195" text-anchor="middle" fill="#fff" font-size="19" font-family=""Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Arial, sans-serif" font-weight="700">B</text><text x="960.0" y="220" text-anchor="middle" fill="#fff" font-size="11" font-family=""Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Arial, sans-serif">3.95</text><text x="960.0" y="272" text-anchor="middle" class="small">S5</text><text x="960.0" y="290" text-anchor="middle" class="small">400-500m</text><rect x="90" y="315" width="20" height="20" fill="#b95850" rx="3"/><text x="124" y="330" class="label">A  不可触碰：防洪主结构 / 遗迹敏感段</text><rect x="90" y="347" width="20" height="20" fill="#d99a55" rx="3"/><text x="124" y="362" class="label">B  轻量附着：标识、灯光、可逆装置</text><rect x="90" y="379" width="20" height="20" fill="#7a9d78" rx="3"/><text x="124" y="394" class="label">C  可使用界面：台阶、栏杆、临时家具</text><rect x="90" y="411" width="20" height="20" fill="#5c8a99" rx="3"/><text x="124" y="426" class="label">D  铺装植被：下层河岸或边角空间</text>
