<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="560" viewBox="0 0 1320 560">
<rect width="100%" height="100%" fill="#fbfaf7"/>
<style>
text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #263238; }
.title { font-size: 24px; font-weight: 700; }
.subtitle { font-size: 12px; fill: #607d72; }
.header { font-size: 12px; font-weight: 700; fill: #ffffff; }
.cell { font-size: 11px; }
.small { font-size: 10px; fill: #607d72; }
.score { font-size: 13px; font-weight: 700; fill: #ffffff; }
</style>
<text x="70" y="48" class="title">Flood and Vegetation Regeneration Strategy</text><text x="70" y="72" class="subtitle">Design logic for floodable lower-bank planting and post-flood recovery.</text><rect x="70" y="125" width="210" height="40" fill="#4f6f64"/><text x="80" y="151" class="header">flood impact</text><rect x="280" y="125" width="275" height="40" fill="#4f6f64"/><text x="290" y="151" class="header">vegetation response</text><rect x="555" y="125" width="385" height="40" fill="#4f6f64"/><text x="565" y="151" class="header">design strategy</text><rect x="940" y="125" width="190" height="40" fill="#4f6f64"/><text x="950" y="151" class="header">segment</text><rect x="1130" y="125" width="105" height="40" fill="#4f6f64"/><text x="1140" y="151" class="header">resilience</text><rect x="70" y="165" width="210" height="72" fill="#eef2ed" stroke="#d7ded7"/><text x="80" y="188" class="cell">short inundation</text><rect x="280" y="165" width="275" height="72" fill="#eef2ed" stroke="#d7ded7"/><text x="290" y="188" class="cell">wet herbs and willow /</text><text x="290" y="202" class="cell">poplar groups recover</text><rect x="555" y="165" width="385" height="72" fill="#eef2ed" stroke="#d7ded7"/><text x="565" y="188" class="cell">use flood-tolerant, replaceable</text><text x="565" y="202" class="cell">planting modules</text><rect x="940" y="165" width="190" height="72" fill="#eef2ed" stroke="#d7ded7"/><text x="950" y="188" class="cell">lower bank, S5</text><text x="950" y="202" class="cell">edge</text><rect x="1130" y="178" width="54" height="42" rx="5" fill="#ca8751"/><text x="1157" y="205" text-anchor="middle" class="score">4</text><rect x="70" y="237" width="210" height="72" fill="#f7f4ed" stroke="#d7ded7"/><text x="80" y="260" class="cell">sediment deposition</text><rect x="280" y="237" width="275" height="72" fill="#f7f4ed" stroke="#d7ded7"/><text x="290" y="260" class="cell">plant bases may be buried</text><rect x="555" y="237" width="385" height="72" fill="#f7f4ed" stroke="#d7ded7"/><text x="565" y="260" class="cell">keep cleanup route and avoid dense</text><text x="565" y="274" class="cell">blockage</text><rect x="940" y="237" width="190" height="72" fill="#f7f4ed" stroke="#d7ded7"/><text x="950" y="260" class="cell">all lower bank</text><rect x="1130" y="250" width="54" height="42" rx="5" fill="#e4c979"/><text x="1157" y="277" text-anchor="middle" class="score">3</text><rect x="70" y="309" width="210" height="72" fill="#eef2ed" stroke="#d7ded7"/><text x="80" y="332" class="cell">floating debris</text><text x="80" y="346" class="cell">impact</text><rect x="280" y="309" width="275" height="72" fill="#eef2ed" stroke="#d7ded7"/><text x="290" y="332" class="cell">fine planting and</text><text x="290" y="346" class="cell">fixtures are damaged</text><rect x="555" y="309" width="385" height="72" fill="#eef2ed" stroke="#d7ded7"/><text x="565" y="332" class="cell">avoid high-maintenance flowerbeds</text><text x="565" y="346" class="cell">below flood line</text><rect x="940" y="309" width="190" height="72" fill="#eef2ed" stroke="#d7ded7"/><text x="950" y="332" class="cell">S2 / S5 low edge</text><rect x="1130" y="322" width="54" height="42" rx="5" fill="#e4c979"/><text x="1157" y="349" text-anchor="middle" class="score">3</text><rect x="70" y="381" width="210" height="72" fill="#f7f4ed" stroke="#d7ded7"/><text x="80" y="404" class="cell">root-heritage</text><text x="80" y="418" class="cell">conflict</text><rect x="280" y="381" width="275" height="72" fill="#f7f4ed" stroke="#d7ded7"/><text x="290" y="404" class="cell">deep roots can threaten</text><text x="290" y="418" class="cell">remains</text><rect x="555" y="381" width="385" height="72" fill="#f7f4ed" stroke="#d7ded7"/><text x="565" y="404" class="cell">use shallow, containerized or</text><text x="565" y="418" class="cell">offset planting</text><rect x="940" y="381" width="190" height="72" fill="#f7f4ed" stroke="#d7ded7"/><text x="950" y="404" class="cell">S2</text><rect x="1130" y="394" width="54" height="42" rx="5" fill="#b7d3bc"/><text x="1157" y="421" text-anchor="middle" class="score">2</text><rect x="70" y="453" width="210" height="72" fill="#eef2ed" stroke="#d7ded7"/><text x="80" y="476" class="cell">summer drought</text><rect x="280" y="453" width="275" height="72" fill="#eef2ed" stroke="#d7ded7"/><text x="290" y="476" class="cell">upper road plants need</text><text x="290" y="490" class="cell">heat tolerance</text><rect x="555" y="453" width="385" height="72" fill="#eef2ed" stroke="#d7ded7"/><text x="565" y="476" class="cell">combine Mediterranean</text><text x="565" y="490" class="cell">drought-tolerant trees and shrubs</text><rect x="940" y="453" width="190" height="72" fill="#eef2ed" stroke="#d7ded7"/><text x="950" y="476" class="cell">S1 / S3 / S5</text><text x="950" y="490" class="cell">upper</text><rect x="1130" y="466" width="54" height="42" rx="5" fill="#ca8751"/><text x="1157" y="493" text-anchor="middle" class="score">4</text>
</svg>
