<text x="70" y="48" class="title">Human-Bio Interaction Matrix</text><text x="70" y="72" class="subtitle">Use patterns, ecological risk, and spatial controls for a public urban river edge.</text><rect x="70" y="125" width="215" height="40" fill="#4f6f64"/><text x="80" y="151" class="header">interaction</text><rect x="285" y="125" width="235" height="40" fill="#4f6f64"/><text x="295" y="151" class="header">positive value</text><rect x="520" y="125" width="285" height="40" fill="#4f6f64"/><text x="530" y="151" class="header">ecological risk</text><rect x="805" y="125" width="380" height="40" fill="#4f6f64"/><text x="815" y="151" class="header">design control</text><rect x="1185" y="125" width="100" height="40" fill="#4f6f64"/><text x="1195" y="151" class="header">priority</text><rect x="70" y="165" width="215" height="70" fill="#eef2ed" stroke="#d7ded7"/><text x="80" y="188" class="cell">walking and bird</text><text x="80" y="202" class="cell">watching</text><rect x="285" y="165" width="235" height="70" fill="#eef2ed" stroke="#d7ded7"/><text x="295" y="188" class="cell">river ecology becomes</text><text x="295" y="202" class="cell">visible</text><rect x="520" y="165" width="285" height="70" fill="#eef2ed" stroke="#d7ded7"/><text x="530" y="188" class="cell">disturbance near resting</text><text x="530" y="202" class="cell">birds</text><rect x="805" y="165" width="380" height="70" fill="#eef2ed" stroke="#d7ded7"/><text x="815" y="188" class="cell">distant observation point and</text><text x="815" y="202" class="cell">low-disturbance edge</text><circle cx="1220" cy="199" r="20" fill="#ca8751"/><text x="1220" y="204" text-anchor="middle" class="score">4</text><rect x="70" y="235" width="215" height="70" fill="#f7f4ed" stroke="#d7ded7"/><text x="80" y="258" class="cell">children nature</text><text x="80" y="272" class="cell">learning</text><rect x="285" y="235" width="235" height="70" fill="#f7f4ed" stroke="#d7ded7"/><text x="295" y="258" class="cell">connect heritage and</text><text x="295" y="272" class="cell">ecology</text><rect x="520" y="235" width="285" height="70" fill="#f7f4ed" stroke="#d7ded7"/><text x="530" y="258" class="cell">entry into unsafe low</text><text x="530" y="272" class="cell">bank or ruins</text><rect x="805" y="235" width="380" height="70" fill="#f7f4ed" stroke="#d7ded7"/><text x="815" y="258" class="cell">rail, ground marks and clear path</text><text x="815" y="272" class="cell">hierarchy</text><circle cx="1220" cy="269" r="20" fill="#e4c979"/><text x="1220" y="274" text-anchor="middle" class="score">3</text><rect x="70" y="305" width="215" height="70" fill="#eef2ed" stroke="#d7ded7"/><text x="80" y="328" class="cell">dog walking</text><rect x="285" y="305" width="235" height="70" fill="#eef2ed" stroke="#d7ded7"/><text x="295" y="328" class="cell">real daily use</text><rect x="520" y="305" width="285" height="70" fill="#eef2ed" stroke="#d7ded7"/><text x="530" y="328" class="cell">trampling, fecal</text><text x="530" y="342" class="cell">pollution, bird</text><text x="530" y="356" class="cell">disturbance</text><rect x="805" y="305" width="380" height="70" fill="#eef2ed" stroke="#d7ded7"/><text x="815" y="328" class="cell">separate accessible path from core</text><text x="815" y="342" class="cell">habitat strip</text><circle cx="1220" cy="339" r="20" fill="#9f4d4a"/><text x="1220" y="344" text-anchor="middle" class="score">5</text><rect x="70" y="375" width="215" height="70" fill="#f7f4ed" stroke="#d7ded7"/><text x="80" y="398" class="cell">night use</text><rect x="285" y="375" width="235" height="70" fill="#f7f4ed" stroke="#d7ded7"/><text x="295" y="398" class="cell">safety and extended</text><text x="295" y="412" class="cell">use</text><rect x="520" y="375" width="285" height="70" fill="#f7f4ed" stroke="#d7ded7"/><text x="530" y="398" class="cell">light spill affects</text><text x="530" y="412" class="cell">insects and birds</text><rect x="805" y="375" width="380" height="70" fill="#f7f4ed" stroke="#d7ded7"/><text x="815" y="398" class="cell">low-level downward lighting away</text><text x="815" y="412" class="cell">from habitat edge</text><circle cx="1220" cy="409" r="20" fill="#ca8751"/><text x="1220" y="414" text-anchor="middle" class="score">4</text><rect x="70" y="445" width="215" height="70" fill="#eef2ed" stroke="#d7ded7"/><text x="80" y="468" class="cell">tourism and</text><text x="80" y="482" class="cell">photography</text><rect x="285" y="445" width="235" height="70" fill="#eef2ed" stroke="#d7ded7"/><text x="295" y="468" class="cell">supports heritage</text><text x="295" y="482" class="cell">legibility</text><rect x="520" y="445" width="285" height="70" fill="#eef2ed" stroke="#d7ded7"/><text x="530" y="468" class="cell">crowding and trampling</text><rect x="805" y="445" width="380" height="70" fill="#eef2ed" stroke="#d7ded7"/><text x="815" y="468" class="cell">durable viewing platform and</text><text x="815" y="482" class="cell">reinforced path</text><circle cx="1220" cy="479" r="20" fill="#e4c979"/><text x="1220" y="484" text-anchor="middle" class="score">3</text><rect x="70" y="515" width="215" height="70" fill="#f7f4ed" stroke="#d7ded7"/><text x="80" y="538" class="cell">maintenance</text><rect x="285" y="515" width="235" height="70" fill="#f7f4ed" stroke="#d7ded7"/><text x="295" y="538" class="cell">keeps flood edge safe</text><rect x="520" y="515" width="285" height="70" fill="#f7f4ed" stroke="#d7ded7"/><text x="530" y="538" class="cell">over-cleaning removes</text><text x="530" y="552" class="cell">habitat</text><rect x="805" y="515" width="380" height="70" fill="#f7f4ed" stroke="#d7ded7"/><text x="815" y="538" class="cell">maintenance zoning and minimum</text><text x="815" y="552" class="cell">disturbance rule</text><circle cx="1220" cy="549" r="20" fill="#9f4d4a"/><text x="1220" y="554" text-anchor="middle" class="score">5</text>
